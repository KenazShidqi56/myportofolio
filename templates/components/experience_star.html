{% if user.is_authenticated %}
<form method="post" action="{% url 'main:toggle_star_experience' experience.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit" 
            class="button button-star{% if user in experience.starred_by.all %} is-starred{% endif %}"
            tite="{% if experience.starred_by.all %}Starred by {{ experience.starred_by.all|join:', ' }}
                    {% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in experience.starred_by.all %}Unstar{% endif %}
        <span class="star-count">{{ experience.starred_by.count }}</span>
    </button>
</form>
{% endif %}
