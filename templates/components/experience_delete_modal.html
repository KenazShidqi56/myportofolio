<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-project-{{ experience.id }}"
            aria-label="Hapus {{ experience.title }}"
            title="Hapus proyek">
        Delete Experience
    </button>
</p>
<div id="delete-project-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ experience.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-experience-title-{{ experience.id }}">Delete experience?</h2>
        <p>
            Are you sure to delete this experience?
            <strong>{{ experience.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Proceed</button>
            </form>
        </div>
    </div>
</div>
