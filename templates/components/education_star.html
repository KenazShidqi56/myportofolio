<form method="post" action="{% url 'main:toggle_star_education' education.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit" 
            class="button button-star{% if user in education.starred_by.all %} is-starred{% endif %}"
            tite="{% if education.starred_by.all %}Starred by {{ education.starred_by.all|join:', ' }}
                    {% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in education.starred_by.all %}Unstar{% endif %}
        <span class="star-count">{{ education.starred_by.count }}</span>
    </button>
</form>
